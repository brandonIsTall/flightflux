# Fetches flight positions from OpenSky and pushes them to the Worker, which cannot reach OpenSky
# from Cloudflare's network. Each run asks the Worker what is due (/api/_plan), so how often it runs
# only sets freshness, never the OpenSky credit spend.
#
# Started every 5 minutes by the Worker through GitHub's API (worker/src/dispatch.ts): GitHub's own
# `schedule:` trigger is best-effort and ran this every 3.5-7 hours. The schedule below stays as a
# backup; overlapping runs queue (concurrency group) and the Worker never hands out work twice.
# A run takes ~35 s and bills as 1 minute (free on a public repository).
#
# Secrets (Settings -> Secrets and variables -> Actions): OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET,
# INGEST_SECRET (same value as the Worker's). Variable: FLIGHTFLUX_API (the Worker origin).
name: Poll positions
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: poll
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CONFIGURED: ${{ secrets.INGEST_SECRET != '' && secrets.OPENSKY_CLIENT_ID != '' }}
    steps:
      - name: Skip until the secrets are configured
        if: env.CONFIGURED != 'true'
        run: echo "::notice::Add the INGEST_SECRET, OPENSKY_CLIENT_ID and OPENSKY_CLIENT_SECRET secrets to enable polling."
      - uses: actions/checkout@v5
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-node@v5
        if: env.CONFIGURED == 'true'
        with:
          node-version: 24
          cache: npm
      - if: env.CONFIGURED == 'true'
        run: npm ci --workspace worker --ignore-scripts
      - if: env.CONFIGURED == 'true'
        run: npm run poll -w worker
        env:
          FLIGHTFLUX_API: ${{ vars.FLIGHTFLUX_API || 'https://flightflux-api.brandonisaacjames.workers.dev' }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
