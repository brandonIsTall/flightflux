# Deploys both halves to Cloudflare on every push to main: the API Worker (worker/) and the globe
# (web/, Workers static assets). Typecheck and tests run first, so a broken commit never ships.
# `wrangler deploy` keeps the Worker's secrets (OpenSky, ingest, dispatch token) as they are.
#
# Secrets (Settings -> Secrets and variables -> Actions): CLOUDFLARE_API_TOKEN (a Cloudflare API
# token from the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until the secrets are configured
        if: env.CONFIGURED != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable automatic deploys."
      - uses: actions/checkout@v5
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-node@v5
        if: env.CONFIGURED == 'true'
        with:
          node-version: 24
          cache: npm
      - if: env.CONFIGURED == 'true'
        run: npm ci
      - name: Typecheck and test
        if: env.CONFIGURED == 'true'
        run: npm run typecheck && npm test
      - name: Deploy API
        if: env.CONFIGURED == 'true'
        working-directory: worker
        run: npx wrangler deploy
      - name: Build and deploy globe
        if: env.CONFIGURED == 'true'
        working-directory: web
        run: npm run build && npx wrangler deploy
